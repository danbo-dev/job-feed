name: Daily Job Feed

on:
  schedule:
    # 13:15 UTC. GitHub cron has no timezone support, so this is 7:15am during
    # MDT and 6:15am during MST. Accepted rather than worked around.
    - cron: '15 13 * * *'
  workflow_dispatch:
    inputs:
      first_run:
        description: 'Use a 14-day window instead of 24 hours'
        type: boolean
        default: false

# A run takes 5-8 minutes and commits state at the end. Overlapping runs would
# race on data/seen.json, so never let two run at once.
concurrency:
  group: job-feed
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # beautifulsoup4 is the only third-party import in find_jobs.py.
      - name: Install dependencies
        run: pip install --quiet beautifulsoup4

      # Secrets are NOT ambient - every one has to be mapped explicitly here.
      # Without COMP_FLOOR/COMP_TARGET the sweep silently falls back to the
      # placeholder 0 thresholds in config.json, which marks every salary as
      # clearing target and demotes nothing.
      - name: Run the sweep
        env:
          COMP_FLOOR: ${{ secrets.COMP_FLOOR }}
          COMP_TARGET: ${{ secrets.COMP_TARGET }}
        run: |
          if [ "${{ inputs.first_run }}" = "true" ]; then
            python3 scripts/find_jobs.py --first-run
          else
            python3 scripts/find_jobs.py
          fi

      # Surfaces the go/no-go signal in the run summary without digging through logs.
      - name: Report source health
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          p = pathlib.Path("data/last_run.json")
          if not p.exists():
              print("### Job feed\n\nNo run summary written — the sweep failed.")
              raise SystemExit
          d = json.loads(p.read_text())
          print("### Job feed\n")
          print(f"- **New roles:** {d['new_count']}")
          print(f"- **LinkedIn raw:** {d['linkedin_raw']}")
          print(f"- **Company boards raw:** {d['board_raw']}")
          if d["degraded"]:
              print("\n> ⚠️ **LinkedIn returned 0 while boards worked.** "
                    "The runner IP is almost certainly blocked. Coverage is partial.")
          if d.get("top"):
              print(f"\nTop match: **{d['top']['title']}** @ {d['top']['company']} "
                    f"(score {d['top']['score']})")
          PY

      - name: Email the report
        env:
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: python3 scripts/notify_email.py

      # seen.json is the dedupe state, and it is ONLY safe to commit when the
      # report actually reached Dan. Committing after a failed send marks roles
      # as seen that he never saw, and they never resurface.
      - name: Commit dedupe state
        if: always()
        run: |
          if [ ! -f data/delivered.flag ]; then
            echo "::warning::Report was not delivered - leaving dedupe state untouched so these roles resurface next run."
            exit 0
          fi
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add data/seen.json
          git diff --staged --quiet || git commit -m "Job feed: $(date -u +%Y-%m-%d) [skip ci]"
          git push || true
